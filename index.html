<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Chameleon 3D - Indoor & Custom Brush</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; background: #020617; color: #fff; user-select: none; }
    #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 10; background: rgba(2,6,23,0.95); backdrop-filter: blur(10px); }
    .card { background: #0f172a; padding: 25px; border-radius: 16px; text-align: center; border: 1px solid #1e293b; width: 340px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
    h2 { margin-top: 0; font-size: 24px; color: #38bdf8; }
    button { background: #22c55e; color: #022c22; font-weight: bold; border: none; padding: 12px; margin: 6px 0; border-radius: 8px; cursor: pointer; width: 100%; font-size: 15px; }
    input[type="text"] { padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #020617; color: #fff; text-align: center; width: 90%; margin-bottom: 12px; font-size: 16px; outline: none; }
    #hud { position: absolute; top: 16px; left: 16px; background: rgba(15, 23, 42, 0.9); padding: 14px; border-radius: 12px; display: none; z-index: 5; border: 1px solid #334155; width: 220px; }
    .brush-box { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; background: #020617; padding: 8px; border-radius: 8px; border: 1px solid #334155; }
    .brush-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    #blind-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 8; display: none; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: #ef4444; text-align: center; }
    #ready-btn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 220px; background: #eab308; color: #000; display: none; z-index: 9; font-weight: bold; padding: 14px; border-radius: 8px; border: none; cursor: pointer; }
    #whistle-notify { position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%); color: #facc15; font-size: 28px; font-weight: bold; display: none; z-index: 7; text-shadow: 0 0 10px #facc15; }
    #crosshair { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: #ef4444; border-radius: 50%; transform: translate(-50%, -50%); display: none; pointer-events: none; z-index: 6; border: 1px solid #fff; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
</head>
<body>

  <div id="ui">
    <div class="card">
      <h2>CHAMELEON 3D</h2>
      <input type="text" id="room-input" placeholder="Oda Adı">
      <button onclick="initGame()">OYUNA BAŞLA</button>
    </div>
  </div>

  <div id="crosshair"></div>
  <div id="blind-overlay">BUKALEMUN SAKLANIYOR VE BOYANIYOR...<br><span style="font-size:14px; color:#aaa; margin-top:10px;">Görüş Kapalı</span></div>
  <button id="ready-btn" onclick="setReady()">SAKLANDIM & BOYANDIM!</button>
  <div id="whistle-notify">🎵 ISLIK SESİ GELDİ! 🎵</div>

  <div id="hud">
    <div><b>Rol:</b> <span id="role-label" style="color:#38bdf8;">Bekleniyor...</span></div>
    
    <div id="paint-panel" class="brush-box">
      <div style="font-weight:bold; font-size:13px; color:#38bdf8;">🎨 Fırça Paneli</div>
      <div class="brush-row"><span>Kafa:</span> <input type="color" id="c-head" value="#16a34a" onchange="updatePartColor('head', this.value)"></div>
      <div class="brush-row"><span>Gövde:</span> <input type="color" id="c-body" value="#16a34a" onchange="updatePartColor('body', this.value)"></div>
      <div class="brush-row"><span>Kollar:</span> <input type="color" id="c-arms" value="#16a34a" onchange="updatePartColor('arms', this.value)"></div>
      <div class="brush-row"><span>Bacaklar:</span> <input type="color" id="c-legs" value="#0f172a" onchange="updatePartColor('legs', this.value)"></div>
    </div>

    <div style="font-size:11px; color:#94a3b8; margin-top:8px;">
      [WASD] Hareket | [SPACE] Tırman<br>
      [1] Ayakta | [2] Çömel | [3] Yatağa Yat<br>
      [F] Islık (Bukalemun) / Ateş Et (Avcı)
    </div>
  </div>

  <script>
    let roomName = "", client = null;
    let myId = "p_" + Math.random().toString(36).substr(2, 6);
    let myRole = "chameleon", currentPose = "stand";
    let scene, camera, renderer, playerGroup, opponentGroup;
    let playerParts = {}, opponentParts = {};
    let colliders = [];
    let keys = {}, playerPos = { x: 0, y: 0, z: 0, rotY: 0 };
    let isGameStarted = false;

    let bodyColors = { head: "#16a34a", body: "#16a34a", arms: "#16a34a", legs: "#0f172a" };

    function initGame() {
      roomName = document.getElementById('room-input').value.trim();
      if (!roomName) return alert("Oda adı girin!");

      document.getElementById('ui').style.display = 'none';
      document.getElementById('hud').style.display = 'block';
      document.getElementById('crosshair').style.display = 'block';

      setup3D();
      setupControls();
      connectMQTT();
    }

    function createCharacterModel(isHunter) {
      const group = new THREE.Group();
      
      const headMat = new THREE.MeshStandardMaterial({ color: isHunter ? 0xef4444 : bodyColors.head });
      const bodyMat = new THREE.MeshStandardMaterial({ color: isHunter ? 0xd97706 : bodyColors.body });
      const armMat = new THREE.MeshStandardMaterial({ color: isHunter ? 0xd97706 : bodyColors.arms });
      const legMat = new THREE.MeshStandardMaterial({ color: isHunter ? 0x0f172a : bodyColors.legs });

      const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.4), bodyMat);
      body.position.y = 0.9;
      group.add(body);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), headMat);
      head.position.y = 1.6;
      group.add(head);

      const armGeo = new THREE.BoxGeometry(0.18, 0.7, 0.18);
      const lArm = new THREE.Mesh(armGeo, armMat);
      lArm.position.set(-0.42, 0.85, 0);
      group.add(lArm);
      const rArm = new THREE.Mesh(armGeo, armMat);
      rArm.position.set(0.42, 0.85, 0);
      group.add(rArm);

      const legGeo = new THREE.BoxGeometry(0.2, 0.7, 0.2);
      const lLeg = new THREE.Mesh(legGeo, legMat);
      lLeg.position.set(-0.18, 0.35, 0);
      group.add(lLeg);
      const rLeg = new THREE.Mesh(legGeo, legMat);
      rLeg.position.set(0.18, 0.35, 0);
      group.add(rLeg);

      if (isHunter) {
        const rifle = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 1.2), new THREE.MeshStandardMaterial({ color: 0x000000 }));
        rifle.position.set(0.35, 1.1, -0.4);
        group.add(rifle);
      }

      return { group, headMat, bodyMat, armMat, legMat, body, head };
    }

    function updatePartColor(part, hex) {
      bodyColors[part] = hex;
      const col = parseInt(hex.replace("#", "0x"));
      if (part === 'head') playerParts.headMat.color.setHex(col);
      if (part === 'body') playerParts.bodyMat.color.setHex(col);
      if (part === 'arms') playerParts.armMat.color.setHex(col);
      if (part === 'legs') playerParts.legMat.color.setHex(col);
    }

    function setup3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0f1d);
      scene.fog = new THREE.FogExp2(0x0a0f1d, 0.03);

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const light = new THREE.PointLight(0xffedd5, 1.5, 60);
      light.position.set(0, 15, 0);
      scene.add(light);

      // Kapalı Mekan (Zemin, Tavan ve 4 Duvar)
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
      
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), wallMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), wallMat);
      ceiling.position.y = 10;
      ceiling.rotation.x = Math.PI / 2;
      scene.add(ceiling);

      const createWall = (x, z, rotY) => {
        const w = new THREE.Mesh(new THREE.BoxGeometry(50, 10, 1), wallMat);
        w.position.set(x, 5, z);
        w.rotation.y = rotY;
        scene.add(w);
        colliders.push(w);
      };
      createWall(0, -25, 0);
      createWall(0, 25, 0);
      createWall(-25, 0, Math.PI / 2);
      createWall(25, 0, Math.PI / 2);

      // İç Mekan Objelere (Kutular ve Sütunlar)
      const boxMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.6 });
      const createBox = (x, y, z, w, h, d) => {
        const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), boxMat);
        box.position.set(x, y + h / 2, z);
        scene.add(box);
        colliders.push(box);
      };

      // Engel Ve Tırmanma Kutuları
      createBox(-10, 0, -10, 4, 3, 4);
      createBox(-10, 3, -10, 3, 3, 3); // Üst üste kutu
      createBox(12, 0, 8, 6, 2, 4);
      createBox(0, 0, 15, 3, 8, 3); // Yüksek Sütun
      createBox(-15, 0, 10, 5, 2.5, 5);

      playerParts = createCharacterModel(false);
      opponentParts = createCharacterModel(true);

      playerGroup = playerParts.group;
      opponentGroup = opponentParts.group;

      scene.add(playerGroup);
      scene.add(opponentGroup);

      animate();
    }

    function applyPose(parts, pose) {
      if (pose === "stand") {
        parts.group.rotation.x = 0;
        parts.body.position.y = 0.9;
        parts.head.position.y = 1.6;
      } else if (pose === "crouch") {
        parts.group.rotation.x = 0;
        parts.body.position.y = 0.5;
        parts.head.position.y = 1.1;
      } else if (pose === "lay") {
        // Z-Gömülme Düzeltmesi
        parts.group.rotation.x = -Math.PI / 2;
        parts.body.position.y = 0.3;
        parts.head.position.y = 0.3;
      }
    }

    function connectMQTT() {
      client = new Paho.MQTT.Client("broker.hivemq.com", 8884, myId);
      client.onMessageArrived = onMessage;
      client.connect({
        onSuccess: () => {
          client.subscribe("chameleon3d/" + roomName);
          sendMsg({ type: "ping", sender: myId });
        },
        useSSL: true
      });
    }

    function sendMsg(obj) {
      if (!client || !client.isConnected()) return;
      let message = new Paho.MQTT.Message(JSON.stringify(obj));
      message.destinationName = "chameleon3d/" + roomName;
      client.send(message);
    }

    function onMessage(message) {
      let data = JSON.parse(message.payloadString);
      if (data.sender === myId) return;

      if (data.type === "ping") {
        myRole = "hunter";
        updateRoleState();
        sendMsg({ type: "assign_role", target: data.sender, role: "chameleon", sender: myId });
      }

      if (data.type === "assign_role" && data.target === myId) {
        myRole = data.role;
        updateRoleState();
      }

      if (data.type === "start_game") {
        document.getElementById('blind-overlay').style.display = 'none';
        isGameStarted = true;
      }

      if (data.type === "pos") {
        opponentGroup.position.set(data.x, data.y, data.z);
        opponentGroup.rotation.y = data.rotY;

        if (data.colors) {
          opponentParts.headMat.color.setHex(parseInt(data.colors.head.replace("#", "0x")));
          opponentParts.bodyMat.color.setHex(parseInt(data.colors.body.replace("#", "0x")));
          opponentParts.armMat.color.setHex(parseInt(data.colors.arms.replace("#", "0x")));
          opponentParts.legMat.color.setHex(parseInt(data.colors.legs.replace("#", "0x")));
        }
        applyPose(opponentParts, data.pose);
      }

      if (data.type === "whistle") {
        const notify = document.getElementById('whistle-notify');
        notify.style.display = 'block';
        setTimeout(() => notify.style.display = 'none', 2500);
      }

      if (data.type === "win") {
        alert(data.msg);
        location.reload();
      }
    }

    function updateRoleState() {
      const isH = myRole === "hunter";
      document.getElementById('role-label').innerText = isH ? "AVCI (HUNTER)" : "BUKALEMUN";
      
      if (isH) {
        document.getElementById('blind-overlay').style.display = 'flex';
        document.getElementById('ready-btn').style.display = 'none';
        document.getElementById('paint-panel').style.display = 'none';
        scene.remove(playerGroup);
        playerParts = createCharacterModel(true);
        playerGroup = playerParts.group;
        scene.add(playerGroup);
      } else {
        document.getElementById('ready-btn').style.display = 'block';
        document.getElementById('blind-overlay').style.display = 'none';
      }
    }

    function setReady() {
      document.getElementById('ready-btn').style.display = 'none';
      sendMsg({ type: "start_game", sender: myId });
      isGameStarted = true;
    }

    function setupControls() {
      window.addEventListener('keydown', e => {
        keys[e.key.toLowerCase()] = true;
        if (e.key === ' ') keys['space'] = true;

        if (e.key === '1') currentPose = "stand";
        if (e.key === '2') currentPose = "crouch";
        if (e.key === '3') currentPose = "lay";
        applyPose(playerParts, currentPose);

        if (e.key.toLowerCase() === 'f') {
          if (myRole === "chameleon") sendMsg({ type: "whistle", sender: myId });
          else if (myRole === "hunter" && isGameStarted) triggerShoot();
        }
      });

      window.addEventListener('keyup', e => {
        keys[e.key.toLowerCase()] = false;
        if (e.key === ' ') keys['space'] = false;
      });

      window.addEventListener('mousemove', e => {
        if (document.pointerLockElement === document.body && (isGameStarted || myRole === "chameleon")) {
          playerPos.rotY -= e.movementX * 0.003;
        }
      });

      window.addEventListener('click', () => {
        if (isGameStarted || myRole === "chameleon") {
          document.body.requestPointerLock();
          if (myRole === "hunter" && isGameStarted) triggerShoot();
        }
      });
    }

    function triggerShoot() {
      if (playerGroup.position.distanceTo(opponentGroup.position) < 4) {
        sendMsg({ type: "win", msg: "Avcı Bukalemunu Vurdu! Avcı Kazandı!", sender: myId });
        alert("Bukalemunu Vurdun! Kazandın!");
        location.reload();
      }
    }

    function updateControls() {
      if (myRole === "hunter" && !isGameStarted) return;

      const speed = 0.14;
      let moveX = 0, moveZ = 0;

      if (keys['w']) moveZ += speed;
      if (keys['s']) moveZ -= speed;
      if (keys['a']) moveX += speed;
      if (keys['d']) moveX -= speed;

      let nextX = playerPos.x + moveZ * Math.sin(playerPos.rotY) + moveX * Math.cos(playerPos.rotY);
      let nextZ = playerPos.z + moveZ * Math.cos(playerPos.rotY) - moveX * Math.sin(playerPos.rotY);

      // Çarpışma Mekanizması (Sınırlar ve Kutuların İçine Girmeme)
      let canMove = true;
      let nearWallForClimb = false;

      const playerBox = new THREE.Box3().setFromCenterAndSize(
        new THREE.Vector3(nextX, playerPos.y + 0.8, nextZ),
        new THREE.Vector3(0.8, 1.6, 0.8)
      );

      for (let col of colliders) {
        const colBox = new THREE.Box3().setFromObject(col);
        if (playerBox.intersectsBox(colBox)) {
          canMove = false;
          nearWallForClimb = true;
          break;
        }
      }

      if (canMove) {
        playerPos.x = nextX;
        playerPos.z = nextZ;
      }

      // Tırmanma Mantığı (Duvara veya kutuya değiyorken SPACE)
      if (keys['space'] && nearWallForClimb) {
        if (playerPos.y < 8) playerPos.y += 0.12;
      } else {
        // Yer Çekimi
        if (playerPos.y > 0) playerPos.y -= 0.1;
        if (playerPos.y < 0) playerPos.y = 0;
      }

      playerGroup.position.set(playerPos.x, playerPos.y, playerPos.z);
      playerGroup.rotation.y = playerPos.rotY;

      // Kamera
      camera.position.x = playerPos.x - Math.sin(playerPos.rotY) * 4.5;
      camera.position.z = playerPos.z - Math.cos(playerPos.rotY) * 4.5;
      camera.position.y = playerPos.y + 2.5;
      camera.lookAt(playerPos.x, playerPos.y + 1.2, playerPos.z);

      sendMsg({
        type: "pos",
        x: playerPos.x,
        y: playerPos.y,
        z: playerPos.z,
        rotY: playerPos.rotY,
        colors: bodyColors,
        pose: currentPose,
        sender: myId
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      updateControls();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
