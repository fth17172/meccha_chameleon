<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Chameleon 3D - Ultimate Edition</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; background: #020617; color: #fff; user-select: none; }
    #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 10; background: rgba(2,6,23,0.95); backdrop-filter: blur(10px); }
    .card { background: #0f172a; padding: 25px; border-radius: 16px; text-align: center; border: 1px solid #1e293b; width: 340px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
    h2 { margin-top: 0; font-size: 24px; color: #38bdf8; letter-spacing: 1px; }
    button { background: #22c55e; color: #022c22; font-weight: bold; border: none; padding: 12px; margin: 6px 0; border-radius: 8px; cursor: pointer; width: 100%; font-size: 15px; }
    input[type="text"] { padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #020617; color: #fff; text-align: center; width: 90%; margin-bottom: 12px; font-size: 16px; outline: none; }
    #hud { position: absolute; top: 16px; left: 16px; background: rgba(15, 23, 42, 0.9); padding: 14px; border-radius: 12px; display: none; z-index: 5; border: 1px solid #334155; }
    .paint-box { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    #blind-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 8; display: none; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: #ef4444; text-align: center; }
    #ready-btn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 220px; background: #eab308; color: #000; display: none; z-index: 9; font-weight: bold; padding: 14px; border-radius: 8px; border: none; cursor: pointer; }
    #whistle-notify { position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%); color: #facc15; font-size: 28px; font-weight: bold; display: none; z-index: 7; text-shadow: 0 0 10px #facc15; }
    #crosshair { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: #ef4444; border-radius: 50%; transform: translate(-50%, -50%); display: none; pointer-events: none; z-index: 6; border: 1px solid #fff; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
</head>
<body>

  <div id="ui">
    <div class="card">
      <h2>CHAMELEON 3D</h2>
      <input type="text" id="room-input" placeholder="Oda Adı">
      <button onclick="initGame('pc')">OYUNA BAŞLA (PC)</button>
    </div>
  </div>

  <div id="crosshair"></div>
  <div id="blind-overlay">BUKALEMUN SAKLANIYOR VE BOYANIYOR...<br><span style="font-size:14px; color:#aaa; margin-top:10px;">Görüş Kapalı</span></div>
  <button id="ready-btn" onclick="setReady()">SAKLANDIM & BOYANDIM!</button>
  <div id="whistle-notify">🎵 ISLIK SESİ GELDİ! 🎵</div>

  <div id="hud">
    <div><b>Rol:</b> <span id="role-label" style="color:#38bdf8;">Bekleniyor...</span></div>
    <div id="paint-panel" class="paint-box">
      <label for="live-color" style="font-size:12px;">Kamuflaj Rengi:</label>
      <input type="color" id="live-color" value="#16a34a" onchange="changeColor(this.value)">
    </div>
    <div id="controls-info" style="font-size:11px; color:#94a3b8; margin-top:8px;">
      [WASD] Hareket<br>
      [1] Ayakta | [2] Çömel | [3] Yatağa Yat<br>
      [F] Islık Çal (Bukalemun) / Ateş Et (Avcı)
    </div>
  </div>

  <script>
    let roomName = "", client = null;
    let myId = "p_" + Math.random().toString(36).substr(2, 6);
    let myRole = "chameleon", currentColor = "#16a34a", currentPose = "stand";
    let scene, camera, renderer, playerGroup, opponentGroup;
    let playerParts = {}, opponentParts = {};
    let keys = {}, playerPos = { x: 0, z: 0, rotY: 0 };
    let isGameStarted = false;

    let seed = 54321;
    function pseudoRandom() {
      let x = Math.sin(seed++) * 10000;
      return x - Math.floor(x);
    }

    function initGame(type) {
      roomName = document.getElementById('room-input').value.trim();
      if (!roomName) return alert("Oda adı girin!");

      document.getElementById('ui').style.display = 'none';
      document.getElementById('hud').style.display = 'block';
      document.getElementById('crosshair').style.display = 'block';

      setup3D();
      setupControls();
      connectMQTT();
    }

    function createCharacterModel(colorHex, isHunter) {
      const group = new THREE.Group();
      const matBody = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.6 });
      const matSkin = new THREE.MeshStandardMaterial({ color: 0xffdbac });
      const matDark = new THREE.MeshStandardMaterial({ color: 0x1e293b });

      const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.4), matBody);
      body.position.y = 0.9;
      body.castShadow = true;
      group.add(body);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), matSkin);
      head.position.y = 1.6;
      head.castShadow = true;
      group.add(head);

      const legGeo = new THREE.BoxGeometry(0.2, 0.7, 0.2);
      const leftLeg = new THREE.Mesh(legGeo, matDark);
      leftLeg.position.set(-0.18, 0.35, 0);
      group.add(leftLeg);

      const rightLeg = new THREE.Mesh(legGeo, matDark);
      rightLeg.position.set(0.18, 0.35, 0);
      group.add(rightLeg);

      // Hunter Silahı
      if (isHunter) {
        const rifle = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 1.2), new THREE.MeshStandardMaterial({ color: 0x000000 }));
        rifle.position.set(0.35, 1.1, -0.4);
        group.add(rifle);
      }

      return { group, matBody, body, head, leftLeg, rightLeg };
    }

    function setup3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020617);
      scene.fog = new THREE.FogExp2(0x020617, 0.015);

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const sun = new THREE.DirectionalLight(0xffedd5, 1.2);
      sun.position.set(30, 50, 30);
      sun.castShadow = true;
      scene.add(sun);

      const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 });
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      // Sabit Harita Yapısı
      for (let i = 0; i < 60; i++) {
        const x = (pseudoRandom() - 0.5) * 100;
        const z = (pseudoRandom() - 0.5) * 100;
        const type = pseudoRandom();

        if (type > 0.6) {
          const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 3), new THREE.MeshStandardMaterial({ color: 0x78350f }));
          trunk.position.set(x, 1.5, z);
          scene.add(trunk);
          const leaves = new THREE.Mesh(new THREE.ConeGeometry(3, 6, 6), new THREE.MeshStandardMaterial({ color: 0x166534 }));
          leaves.position.set(x, 5, z);
          scene.add(leaves);
        } else if (type > 0.3) {
          const bush = new THREE.Mesh(new THREE.DodecahedronGeometry(1.6), new THREE.MeshStandardMaterial({ color: 0x15803d }));
          bush.position.set(x, 0.8, z);
          scene.add(bush);
        } else {
          const house = new THREE.Mesh(new THREE.BoxGeometry(5, 4, 5), new THREE.MeshStandardMaterial({ color: 0x334155 }));
          house.position.set(x, 2, z);
          scene.add(house);
        }
      }

      playerParts = createCharacterModel(currentColor, false);
      opponentParts = createCharacterModel("#ef4444", true);

      playerGroup = playerParts.group;
      opponentGroup = opponentParts.group;

      scene.add(playerGroup);
      scene.add(opponentGroup);

      animate();
    }

    function changeColor(hex) {
      currentColor = hex;
      playerParts.matBody.color.setHex(parseInt(hex.replace("#", "0x")));
    }

    function applyPose(parts, pose) {
      if (pose === "stand") {
        parts.group.rotation.x = 0;
        parts.group.position.y = 0;
      } else if (pose === "crouch") {
        parts.group.rotation.x = 0;
        parts.group.position.y = -0.4;
      } else if (pose === "lay") {
        parts.group.rotation.x = -Math.PI / 2;
        parts.group.position.y = -0.6;
      }
    }

    function connectMQTT() {
      client = new Paho.MQTT.Client("broker.hivemq.com", 8884, myId);
      client.onMessageArrived = onMessage;
      
      client.connect({
        onSuccess: () => {
          client.subscribe("chameleon3d/" + roomName);
          sendMsg({ type: "ping", sender: myId });
        },
        useSSL: true
      });
    }

    function sendMsg(obj) {
      if (!client || !client.isConnected()) return;
      let message = new Paho.MQTT.Message(JSON.stringify(obj));
      message.destinationName = "chameleon3d/" + roomName;
      client.send(message);
    }

    function onMessage(message) {
      let data = JSON.parse(message.payloadString);
      if (data.sender === myId) return;

      if (data.type === "ping") {
        myRole = "hunter";
        updateRoleState();
        sendMsg({ type: "assign_role", target: data.sender, role: "chameleon", sender: myId });
      }

      if (data.type === "assign_role" && data.target === myId) {
        myRole = data.role;
        updateRoleState();
      }

      if (data.type === "start_game") {
        document.getElementById('blind-overlay').style.display = 'none';
        isGameStarted = true;
      }

      if (data.type === "pos") {
        opponentGroup.position.x = data.x;
        opponentGroup.position.z = data.z;
        opponentGroup.rotation.y = data.rotY;
        opponentParts.matBody.color.setHex(data.color);
        applyPose(opponentParts, data.pose);
      }

      if (data.type === "whistle") {
        const notify = document.getElementById('whistle-notify');
        notify.style.display = 'block';
        setTimeout(() => notify.style.display = 'none', 2500);
      }

      if (data.type === "win") {
        alert(data.msg);
        location.reload();
      }
    }

    function updateRoleState() {
      const isH = myRole === "hunter";
      document.getElementById('role-label').innerText = isH ? "AVCI (HUNTER)" : "BUKALEMUN";
      
      if (isH) {
        document.getElementById('blind-overlay').style.display = 'flex';
        document.getElementById('ready-btn').style.display = 'none';
        document.getElementById('paint-panel').style.display = 'none';
        // Hunter modeli yenile
        scene.remove(playerGroup);
        playerParts = createCharacterModel("#ef4444", true);
        playerGroup = playerParts.group;
        scene.add(playerGroup);
      } else {
        document.getElementById('ready-btn').style.display = 'block';
        document.getElementById('blind-overlay').style.display = 'none';
      }
    }

    function setReady() {
      document.getElementById('ready-btn').style.display = 'none';
      sendMsg({ type: "start_game", sender: myId });
      isGameStarted = true;
    }

    function setupControls() {
      window.addEventListener('keydown', e => {
        keys[e.key.toLowerCase()] = true;

        if (e.key === '1') currentPose = "stand";
        if (e.key === '2') currentPose = "crouch";
        if (e.key === '3') currentPose = "lay";
        applyPose(playerParts, currentPose);

        if (e.key.toLowerCase() === 'f') {
          if (myRole === "chameleon") {
            sendMsg({ type: "whistle", sender: myId });
          } else if (myRole === "hunter" && isGameStarted) {
            triggerShoot();
          }
        }
      });

      window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

      window.addEventListener('mousemove', e => {
        if (document.pointerLockElement === document.body && (isGameStarted || myRole === "chameleon")) {
          playerPos.rotY -= e.movementX * 0.003;
        }
      });

      window.addEventListener('click', () => {
        if (isGameStarted || myRole === "chameleon") {
          document.body.requestPointerLock();
          if (myRole === "hunter" && isGameStarted) triggerShoot();
        }
      });
    }

    function triggerShoot() {
      if (playerGroup.position.distanceTo(opponentGroup.position) < 4) {
        sendMsg({ type: "win", msg: "Avcı Bukalemunu Vurdu! Avcı Kazandı!", sender: myId });
        alert("Bukalemunu Vurdun! Kazandın!");
        location.reload();
      }
    }

    function updateControls() {
      if (myRole === "hunter" && !isGameStarted) return;

      const speed = 0.14;
      let moveX = 0, moveZ = 0;

      // WASD Düzeltmesi (Ileri-Geri Mantığı Karekter Yönüne Göre)
      if (keys['w']) moveZ += speed;
      if (keys['s']) moveZ -= speed;
      if (keys['a']) moveX += speed;
      if (keys['d']) moveX -= speed;

      // Rotasyona Bağlı Yön
      playerPos.x += moveZ * Math.sin(playerPos.rotY) + moveX * Math.cos(playerPos.rotY);
      playerPos.z += moveZ * Math.cos(playerPos.rotY) - moveX * Math.sin(playerPos.rotY);

      playerGroup.position.x = playerPos.x;
      playerGroup.position.z = playerPos.z;
      playerGroup.rotation.y = playerPos.rotY;

      // Kamera Arkip
      camera.position.x = playerPos.x - Math.sin(playerPos.rotY) * 4.5;
      camera.position.z = playerPos.z - Math.cos(playerPos.rotY) * 4.5;
      camera.position.y = 2.5;
      camera.lookAt(playerPos.x, 1.2, playerPos.z);

      sendMsg({
        type: "pos",
        x: playerPos.x,
        z: playerPos.z,
        rotY: playerPos.rotY,
        color: parseInt(currentColor.replace("#", "0x")),
        pose: currentPose,
        sender: myId
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      updateControls();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
