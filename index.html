<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Chameleon 3D Online</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background: #0f172a; color: #fff; user-select: none; }
    #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 10; background: #0f172a; }
    .card { background: #1e293b; padding: 25px; border-radius: 12px; text-align: center; border: 1px solid #334155; width: 300px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    button { background: #22c55e; color: #022c22; font-weight: bold; border: none; padding: 12px; margin: 8px 0; border-radius: 6px; cursor: pointer; width: 100%; font-size: 15px; }
    button:hover { background: #16a34a; }
    input { padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; text-align: center; width: 90%; margin-bottom: 10px; font-size: 16px; }
    #hud { position: absolute; top: 12px; left: 12px; background: rgba(15, 23, 42, 0.85); padding: 12px; border-radius: 8px; display: none; z-index: 5; border: 1px solid #334155; }
    #mobile-btn { position: absolute; bottom: 30px; right: 30px; width: 70px; height: 70px; background: #ef4444; border-radius: 50%; display: none; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; z-index: 5; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
</head>
<body>

  <div id="ui">
    <div id="setup-card" class="card">
      <h2 style="margin-top:0;">CHAMELEON 3D</h2>
      <input type="text" id="room-input" placeholder="Oda Adı Gir (Örn: oda1)">
      
      <p style="font-size:12px; color:#94a3b8; margin: 5px 0 10px 0;">Cihazını Seç ve Başla:</p>
      <button onclick="initGame('pc')">PC (Klavye + Fare)</button>
      <button onclick="initGame('mobile')">Mobil (Dokunmatik)</button>
    </div>
  </div>

  <div id="hud">
    <div><b>Rol:</b> <span id="role-label">Bağlanıyor...</span></div>
    <div id="controls-hint" style="font-size:11px; color:#94a3b8; margin-top:4px;">[WASD] Hareket | [E] Aksiyon</div>
  </div>

  <div id="mobile-btn" onclick="triggerAction()">E</div>

  <script>
    let deviceType = null, roomName = "", client = null;
    let myId = "p_" + Math.random().toString(36).substr(2, 6);
    let myRole = "chameleon";
    let scene, camera, renderer, playerMesh, opponentMesh;
    let keys = {}, playerPos = { x: (Math.random()-0.5)*10, z: (Math.random()-0.5)*10, rotY: 0 }, isCamo = false;

    function initGame(type) {
      roomName = document.getElementById('room-input').value.trim();
      if (!roomName) return alert("Lütfen bir oda adı yazın!");
      
      deviceType = type;
      document.getElementById('ui').style.display = 'none';
      document.getElementById('hud').style.display = 'block';
      if (deviceType === 'mobile') document.getElementById('mobile-btn').style.display = 'flex';

      setup3D();
      setupControls();
      connectMQTT();
    }

    function connectMQTT() {
      // SSL/TLS destekleyen 8884 portu (Vercel HTTPS kısıtlamasını aşar)
      client = new Paho.MQTT.Client("broker.hivemq.com", 8884, myId);
      client.onMessageArrived = onMessage;
      
      client.connect({
        onSuccess: () => {
          document.getElementById('role-label').innerText = "Oda Aranıyor...";
          client.subscribe("chameleon3d/" + roomName);
          
          // Odaya duyuru yap
          sendMsg({ type: "ping", sender: myId });
        },
        useSSL: true,
        timeout: 5sss
      });
    }

    function sendMsg(obj) {
      if (!client || !client.isConnected()) return;
      let message = new Paho.MQTT.Message(JSON.stringify(obj));
      message.destinationName = "chameleon3d/" + roomName;
      client.send(message);
    }

    function onMessage(message) {
      let data = JSON.parse(message.payloadString);
      if (data.sender === myId) return;

      if (data.type === "ping") {
        // İkinci oyuncu geldi: Odayı kuran kendini Avcı ilan eder, karşıya Bukalemun der
        myRole = "hunter";
        updateRoleUI();
        sendMsg({ type: "assign_role", target: data.sender, role: "chameleon", sender: myId });
      }

      if (data.type === "assign_role" && data.target === myId) {
        myRole = data.role;
        updateRoleUI();
      }

      if (data.type === "pos") {
        opponentMesh.position.set(data.x, 0.5, data.z);
        opponentMesh.rotation.y = data.rotY;
        opponentMesh.material.color.setHex(data.camo ? 0x1e293b : (myRole === "hunter" ? 0x22c55e : 0xef4444));
      }

      if (data.type === "win") {
        alert(data.msg);
        location.reload();
      }
    }

    function updateRoleUI() {
      document.getElementById('role-label').innerText = myRole === "hunter" ? "AVCI (HUNTER)" : "BUKALEMUN";
      playerMesh.material.color.setHex(myRole === "hunter" ? 0xef4444 : 0x22c55e);
    }

    function setup3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a);
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(10, 20, 10);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0xffffff, 0.4));

      const floor = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      for (let i = 0; i < 20; i++) {
        const bush = new THREE.Mesh(new THREE.DodecahedronGeometry(1.2), new THREE.MeshStandardMaterial({ color: 0x334155 }));
        bush.position.set((Math.random() - 0.5) * 40, 1, (Math.random() - 0.5) * 40);
        scene.add(bush);
      }

      playerMesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0x22c55e }));
      opponentMesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0xef4444 }));
      scene.add(playerMesh);
      scene.add(opponentMesh);

      animate();
    }

    function setupControls() {
      if (deviceType === 'pc') {
        window.addEventListener('keydown', e => {
          keys[e.key.toLowerCase()] = true;
          if (e.key.toLowerCase() === 'e') triggerAction();
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
        window.addEventListener('mousemove', e => {
          if (document.pointerLockElement === document.body) {
            playerPos.rotY -= e.movementX * 0.004;
          }
        });
        window.addEventListener('click', () => document.body.requestPointerLock());
      }
    }

    function triggerAction() {
      if (myRole === "chameleon") {
        isCamo = !isCamo;
      } else if (myRole === "hunter") {
        if (playerMesh.position.distanceTo(opponentMesh.position) < 3) {
          sendMsg({ type: "win", msg: "Avcı Bukalemunu Yakaladı! Avcı Kazandı!", sender: myId });
          alert("Bukalemunu Yakaladın! Kazandın!");
          location.reload();
        }
      }
    }

    function update() {
      const speed = 0.12;
      let moveX = 0, moveZ = 0;

      if (keys['w']) moveZ -= speed;
      if (keys['s']) moveZ += speed;
      if (keys['a']) moveX -= speed;
      if (keys['d']) moveX += speed;

      playerPos.x += moveX * Math.cos(playerPos.rotY) + moveZ * Math.sin(playerPos.rotY);
      playerPos.z += moveZ * Math.cos(playerPos.rotY) - moveX * Math.sin(playerPos.rotY);

      playerMesh.position.set(playerPos.x, 0.5, playerPos.z);
      playerMesh.rotation.y = playerPos.rotY;

      playerMesh.material.color.setHex(isCamo ? 0x1e293b : (myRole === "hunter" ? 0xef4444 : 0x22c55e));

      camera.position.x = playerPos.x - Math.sin(playerPos.rotY) * 6;
      camera.position.z = playerPos.z - Math.cos(playerPos.rotY) * 6;
      camera.position.y = 4;
      camera.lookAt(playerMesh.position);

      sendMsg({
        type: "pos",
        x: playerPos.x,
        z: playerPos.z,
        rotY: playerPos.rotY,
        camo: isCamo,
        sender: myId
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
