<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chameleon 3D</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background: #111; color: #fff; }
    #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 10; }
    .card { background: rgba(0,0,0,0.9); padding: 20px; border-radius: 8px; text-align: center; border: 1px solid #333; min-width: 280px; }
    button { background: #22c55e; color: #000; font-weight: bold; border: none; padding: 12px 20px; margin: 10px; border-radius: 4px; cursor: pointer; width: 80%; }
    input { padding: 10px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; text-align: center; width: 80%; margin-bottom: 10px; }
    #hud { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 4px; display: none; z-index: 5; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div id="ui">
    <div id="menu" class="card">
      <h2>CHAMELEON 3D</h2>
      <button onclick="selectDevice('pc')">PC (Klavye + Fare)</button>
      <button onclick="selectDevice('mobile')">Mobil (Dokunmatik)</button>
    </div>

    <div id="lobby" class="card" style="display:none;">
      <h2>LOBİ</h2>
      <p id="my-id">ID Yükleniyor...</p>
      <button onclick="copyID()">ID'yi Kopyala</button>
      <hr style="border-color:#333; margin: 15px 0;">
      <input type="text" id="join-id" placeholder="Rakip ID Yapıştır">
      <button onclick="joinRoom()">Katıl</button>
    </div>
  </div>

  <div id="hud">
    <div id="role-text">Rol: Bekleniyor...</div>
  </div>

  <script>
    let deviceType = null, peer = null, conn = null, myId = '';

    function selectDevice(type) {
      deviceType = type;
      document.getElementById('menu').style.display = 'none';
      document.getElementById('lobby').style.display = 'block';
      initPeer();
    }

    function initPeer() {
      peer = new Peer();
      peer.on('open', id => {
        myId = id;
        document.getElementById('my-id').innerText = "Senin ID: " + id;
      });

      peer.on('connection', c => {
        conn = c;
        startGame();
      });

      peer.on('error', err => {
        alert('Bağlantı Hatası: ' + err.type);
      });
    }

    function copyID() {
      if(!myId) return alert('ID henüz hazır değil!');
      navigator.clipboard.writeText(myId);
      alert('ID kopyalandı, arkadaşına at!');
    }

    function joinRoom() {
      const destId = document.getElementById('join-id').value.trim();
      if (!destId) return alert("ID gir!");
      conn = peer.connect(destId);
      conn.on('open', () => {
        startGame();
      });
    }

    function startGame() {
      document.getElementById('ui').style.display = 'none';
      document.getElementById('hud').style.display = 'block';
      document.getElementById('role-text').innerText = "Bağlantı Başarılı! Oyun Başladı.";
      
      // Three.js Basit Sahne
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer();
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const geometry = new THREE.BoxGeometry();
      const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
      const cube = new THREE.Mesh(geometry, material);
      scene.add(cube);
      camera.position.z = 5;

      function animate() {
        requestAnimationFrame(animate);
        cube.rotation.x += 0.01;
        cube.rotation.y += 0.01;
        renderer.render(scene, camera);
      }
      animate();
    }
  </script>
</body>
</html>
