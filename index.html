<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Chameleon Online 3D</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: monospace; background: #111; color: #fff; user-select: none; }
    #ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .interactive { pointer-events: auto; }
    #menu, #lobby { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.85); padding: 20px; border-radius: 8px; text-align: center; border: 1px solid #444; width: 300px; }
    button { background: #22c55e; color: #000; font-weight: bold; border: none; padding: 10px 20px; margin: 10px; border-radius: 4px; cursor: pointer; }
    button:hover { background: #16a34a; }
    input { padding: 8px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; text-align: center; margin-bottom: 10px; width: 80%; }
    #hud { position: absolute; top: 10px; left: 10px; font-size: 14px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 4px; display: none; }
    #mobile-controls { position: absolute; bottom: 20px; left: 20px; right: 20px; display: none; justify-content: space-between; align-items: center; }
    .joy-btn { width: 60px; height: 60px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; background: red; border-radius: 50%; transform: translate(-50%, -50%); display: none; }
  </style>
  <!-- Three.js ve PeerJS CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div id="ui-overlay">
    <!-- Cihaz Seçim Menüsü -->
    <div id="menu" class="interactive">
      <h2>CHAMELEON 3D</h2>
      <p>Cihaz Tipi Seçin:</p>
      <button onclick="selectDevice('pc')">PC (Klavye + Fare)</button>
      <button onclick="selectDevice('mobile')">Mobil (Dokunmatik)</button>
    </div>

    <!-- Lobi Menüsü -->
    <div id="lobby" class="interactive" style="display:none;">
      <h2>LOBİ</h2>
      <p id="my-id">ID Alınıyor...</p>
      <button onclick="createRoom()">Oda Kur (Rastgele Rol)</button>
      <hr style="border-color:#333;">
      <input type="text" id="join-id" placeholder="Oda ID Girin">
      <button onclick="joinRoom()">Odaya Katıl</button>
    </div>

    <!-- Oyun İçi HUD -->
    <div id="hud">
      <div>Rol: <span id="role-text">-</span></div>
      <div>Durum: <span id="status-text">Bağlantı bekleniyor...</span></div>
      <div id="pc-help" style="margin-top:5px; font-size:11px; color:#aaa;">[WASD] Hareket | [E] Kamuflaj / Avla</div>
    </div>

    <div id="crosshair"></div>

    <!-- Mobil Kontrol Butonları -->
    <div id="mobile-controls" class="interactive">
      <div class="joy-btn" id="btn-action">E</div>
    </div>
  </div>

  <script>
    let deviceType = null;
    let peer = null, conn = null;
    let myRole = null; // 'hunter' veya 'chameleon'
    let scene, camera, renderer, playerMesh, opponentMesh;
    let keys = {}, mousePos = { x: 0, y: 0 };
    let playerPos = { x: (Math.random()-0.5)*10, z: (Math.random()-0.5)*10, rotY: 0 };
    let isCamo = false;

    function selectDevice(type) {
      deviceType = type;
      document.getElementById('menu').style.display = 'none';
      document.getElementById('lobby').style.display = 'block';
      initPeer();
    }

    // PeerJS Bağlantı Kurulumu (Uzak Ağlar İçin Sinyalleşme)
    function initPeer() {
      peer = new Peer();
      peer.on('open', id => {
        document.getElementById('my-id').innerText = "ID'niz: " + id;
      });

      peer.on('connection', c => {
        conn = c;
        setupConnection();
        // Odayı kuran taraf rolleri belirler
        myRole = Math.random() > 0.5 ? 'hunter' : 'chameleon';
        let oppRole = myRole === 'hunter' ? 'chameleon' : 'hunter';
        conn.send({ type: 'init-role', role: oppRole });
        startGame();
      });
    }

    function createRoom() {
      alert("ID'nizi arkadaşınıza gönderin. Bağlandığında oyun başlayacak.");
    }

    function joinRoom() {
      const destId = document.getElementById('join-id').value.trim();
      if (!destId) return alert("Geçerli ID girin!");
      conn = peer.connect(destId);
      setupConnection();
    }

    function setupConnection() {
      conn.on('open', () => {
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        if (deviceType === 'mobile') document.getElementById('mobile-controls').style.display = 'flex';
        if (deviceType === 'pc') document.getElementById('crosshair').style.display = 'block';
      });

      conn.on('data', data => {
        if (data.type === 'init-role') {
          myRole = data.role;
          startGame();
        }
        if (data.type === 'pos') {
          opponentMesh.position.set(data.x, 0.5, data.z);
          opponentMesh.rotation.y = data.rotY;
          opponentMesh.material.color.setHex(data.camo ? 0x228b22 : data.color);
        }
        if (data.type === 'action-win') {
          alert(data.msg);
          location.reload();
        }
      });
    }

    function startGame() {
      document.getElementById('role-text').innerText = myRole === 'hunter' ? 'AVCI (HUNTER)' : 'BUKALEMUN';
      document.getElementById('status-text').innerText = 'Oyun Başladı!';
      init3D();
      setupControls();
      animate();
    }

    // 3D Dünya ve Grafikler (Three.js)
    function init3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a2e);
      scene.fog = new THREE.FogExp2(0x1a1a2e, 0.05);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Işıklandırma
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(20, 40, 20);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // Harita (Zemin ve Objeler/Çalılar)
      const floorGeo = new THREE.PlaneGeometry(60, 60);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      // Çevreye Rastgele Engeller ve Çalılar (Gizlenme Noktaları)
      for (let i = 0; i < 30; i++) {
        const isBush = Math.random() > 0.4;
        const geo = isBush ? new THREE.DodecahedronGeometry(1.5) : new THREE.BoxGeometry(2, 4, 2);
        const mat = new THREE.MeshStandardMaterial({ color: isBush ? 0x228b22 : 0x475569 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set((Math.random()-0.5)*50, isBush ? 1 : 2, (Math.random()-0.5)*50);
        mesh.castShadow = true;
        scene.add(mesh);
      }

      // Oyuncu Karakterleri
      const myColor = myRole === 'hunter' ? 0xef4444 : 0x10b981;
      const oppColor = myRole === 'hunter' ? 0x10b981 : 0xef4444;

      playerMesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: myColor }));
      playerMesh.castShadow = true;
      scene.add(playerMesh);

      opponentMesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: oppColor }));
      opponentMesh.castShadow = true;
      scene.add(opponentMesh);
    }

    function setupControls() {
      if (deviceType === 'pc') {
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
        window.addEventListener('mousemove', e => {
          playerPos.rotY -= e.movementX * 0.003;
        });
        window.addEventListener('click', () => {
          document.body.requestPointerLock();
        });
      }

      document.getElementById('btn-action').addEventListener('click', triggerAction);
    }

    function triggerAction() {
      if (myRole === 'chameleon') {
        isCamo = !isCamo; // Kamuflajı aç/kapat
      } else if (myRole === 'hunter') {
        // Avlanma kontrolü (Mesafe Kontrolü)
        const dist = playerMesh.position.distanceTo(opponentMesh.position);
        if (dist < 3) {
          conn.send({ type: 'action-win', msg: 'Avcı Bukalemun'u Yakaladı! Avcı Kazandı!' });
          alert('Bukalemun'u Yakaladın! Kazandın!');
          location.reload();
        }
      }
    }

    function updatePhysics() {
      const speed = 0.15;
      let moveX = 0, moveZ = 0;

      if (keys['w']) moveZ -= speed;
      if (keys['s']) moveZ += speed;
      if (keys['a']) moveX -= speed;
      if (keys['d']) moveX += speed;

      if (keys['e']) { keys['e'] = false; triggerAction(); }

      // Rotasyona göre hareket
      playerPos.x += moveX * Math.cos(playerPos.rotY) + moveZ * Math.sin(playerPos.rotY);
      playerPos.z += moveZ * Math.cos(playerPos.rotY) - moveX * Math.sin(playerPos.rotY);

      playerMesh.position.set(playerPos.x, 0.5, playerPos.z);
      playerMesh.rotation.y = playerPos.rotY;

      // Kamuflaj Görsel Efekti
      playerMesh.material.color.setHex(isCamo ? 0x228b22 : (myRole === 'hunter' ? 0xef4444 : 0x10b981));

      // Kamera Takibi
      camera.position.x = playerPos.x - Math.sin(playerPos.rotY) * 5;
      camera.position.z = playerPos.z - Math.cos(playerPos.rotY) * 5;
      camera.position.y = 3;
      camera.lookAt(playerMesh.position);

      // Pozisyonu Rakibe Gönder (Network Sync)
      if (conn && conn.open) {
        conn.send({
          type: 'pos',
          x: playerPos.x,
          z: playerPos.z,
          rotY: playerPos.rotY,
          camo: isCamo,
          color: myRole === 'hunter' ? 0xef4444 : 0x10b981
        });
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      updatePhysics();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
